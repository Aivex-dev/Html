<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To Do List</title>
  <link rel="stylesheet" href="2style.css">
</head>
<body>
  <div class="wrapper">
    <h1 class="title">My To Do List</h1>
    <ul class="todo">
      <li class="todo__item">Hit the gym <span class="todo__close">&times;</span></li>
      <li class="todo__item todo__item--done">Pay bills <span class="todo__close">&times;</span></li>
      <li class="todo__item">Meet John <span class="todo__close">&times;</span></li>
      <li class="todo__item">Buy eggs <span class="todo__close">&times;</span></li>
      <li class="todo__item todo__item--done">Read a book <span class="todo__close">&times;</span></li>
      <li class="todo__item">Organize office <span class="todo__close">&times;</span></li>
      <li class="todo__item">Eat dinner <span class="todo__close">&times;</span></li>
      <li class="todo__item">Buy apples <span class="todo__close">&times;</span></li>
      <li class="todo__item">Meet George <span class="todo__close">&times;</span></li>
      <li class="todo__item">Feed the cat <span class="todo__close">&times;</span></li>
      <li class="todo__item todo__item--done">Write a letter <span class="todo__close">&times;</span></li>
      <li class="todo__item">Run 1 km <span class="todo__close">&times;</span></li>
    </ul>
  </div>
</body>
</html>
