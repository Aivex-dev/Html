<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cards">

    <article class="card card--blue">
      <h2 class="card__title">PRODUCT NAME</h2>
      <p class="card__price">$99.99</p>
      <p class="card__text">This is a brief description of the product and its features. It looks great!</p>
      <button class="card__btn" type="button">BUY NOW</button>
    </article>

    <article class="card card--green">
      <h2 class="card__title">PRODUCT NAME</h2>
      <p class="card__price">$99.99</p>
      <p class="card__text">This is a brief description of the product and its features. It looks great!</p>
      <button class="card__btn" type="button">BUY NOW</button>
    </article>

    <article class="card card--purple">
      <h2 class="card__title">PRODUCT NAME</h2>
      <p class="card__price">$99.99</p>
      <p class="card__text">This is a brief description of the product and its features. It looks great!</p>
      <button class="card__btn" type="button">BUY NOW</button>
    </article>

  </main>
</body>
</html>
